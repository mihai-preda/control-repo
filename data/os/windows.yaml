# build. To move to a newer agent, bump both keys together - the checksum
# belongs to the file published under <msi_base_url>/6.0/<msi_version>/.
profile::zabbix_agent::msi_version: '6.0.48'
profile::zabbix_agent::msi_checksum: '9919e9b93f218b1d90ace4ee3a53e6fef2bab84140d467738888dc20d48e6810'
