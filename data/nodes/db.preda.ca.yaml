# data/nodes/db.preda.ca.yaml
---

profile::puppetdb::database_password: "ENC[PKCS7,]"
profile::zabbixdb::database_password: "ENC[PKCS7,]"

puppetdb::server::manage_firewall: false

firewalld::default_zone: 'public'
firewalld::service_ensure: 'running'

firewalld::zones:
  public:
    ensure: present
    target: default

firewalld::services:
  ssh:
    ensure: present
    service: ssh
    zone: public
  dhcp:
    ensure: present
    service: dhcp
    zone: public
  dhcpv6-client:
    ensure: present
    service: dhcpv6-client
    zone: public
  zabbix-agent:
    ensure: present
    service: zabbix-agent
    zone: public
  cockpit:
    ensure: absent
    service: cockpit
    zone: public
puppetdb::postgres_version: '16'
postgresql::globals::manage_package_repo: true
