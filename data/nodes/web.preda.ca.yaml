# puppetboard server
---

profile::puppetboard::secret_key: "ENC[PKCS7,]"

# Front the Tomcat backend on app-srv1 so browsers get a trusted cert; the
# proxy->Tomcat hop stays encrypted against Tomcat's self-signed cert.
profile::app_proxy::backend_url: 'https://app-srv1.preda.ca:8443/'

firewalld::default_zone: 'public'
firewalld::service_ensure: 'running'

firewalld::zones:
  public:
    ensure: present
    target: default
    
firewalld::services:
  'Allow DHCPS, SSH, and Zabbix from the public zone':
    ensure: present
    service: ssh
    zone: public
  dhcp:
    ensure: present
    service: dhcp
    zone: public
  dhcpv6-client:
    ensure: present
    service: dhcpv6-client
    zone: public
  zabbix-agent:
    ensure: present
    service: zabbix-agent
    zone: public
  http:
    ensure: present
    service: http
    zone: public
  https:
    ensure: present
    service: https
    zone: public  
  cockpit:
    ensure: absent
    service: cockpit
    zone: public

firewalld::ports:
  'Open the Tomcat reverse-proxy port':
    ensure: present
    zone: public
    port: 8443
    protocol: 'tcp'
