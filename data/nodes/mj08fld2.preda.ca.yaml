# data/data/nodes/mj08fld2.preda.ca.yaml
---
accounts::user_list:
  mihai:
    groups: [wheel, users, libvirt]

classes:
  - nfs
nfs::client_enabled: true
nfs::nfs_v4_client: true
nfs::nfs_v4_idmap_domain: "%{facts.networking.domain}"
nfs::nfs_v4_mount_root: "/share"
nfs::nfs_server: "debt.preda.ca"
nfs::mounts:
  /mnt/shared:
    server: "debt.preda.ca"
    share: "share"
    atboot: true
    owner: mihai
    group: libvirt
    mode: "0775"


firewalld::default_zone: "public"
firewalld::service_ensure: "running"

firewalld::zones:
  public:
    ensure: present
    target: default

firewalld::services:
  "Allow DHCPS, SSH, and Zabbix from the public zone":
    ensure: present
    service: ssh
    zone: public
  dhcp:
    ensure: present
    service: dhcp
    zone: public
  dhcpv6-client:
    ensure: present
    service: dhcpv6-client
    zone: public
  zabbix-agent:
    ensure: present
    service: zabbix-agent
    zone: public
