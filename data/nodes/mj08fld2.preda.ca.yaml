# data/nodes/mj08fld2.preda.ca.yaml
---
# certbot cannot be installed on AlmaLinux 10.2: EPEL's only python3-pyOpenSSL
# build (26.3.0-1.el10_3, built against RHEL 10.3) needs
# python3.12dist(cryptography) >= 49, and 10.2 BaseOS ships 43.0.0-4.el10.
# Nothing in Puppet can resolve that - it clears when this host reaches Alma
# 10.3. Until then Cockpit keeps serving the cert already on disk.
# TODO: the existing cert expires 2026-11-12. Re-enable and renew before then.
profile::certificates::enabled: false

accounts::user_list:
  mihai:
    groups: [wheel, users, libvirt]

profile::cockpit::packages:
  - cockpit
  - cockpit-machines
  - cockpit-podman
  - cockpit-storaged
  - cockpit-ws
  - cockpit-bridge
  - cockpit-networkmanager
  - cockpit-sosreport
  - cockpit-system
  - cockpit-systemd
  - cockpit-packagekit

nfs::client_enabled: true
nfs::nfs_v4_client: true
nfs::nfs_v4_idmap_domain: "%{facts.networking.domain}"
profile::nfs_client::mounts:
  /mnt/shared:
    server: "debtnas.preda.ca"
    share: "/mnt/pool1/ds3/share"
    atboot: true

firewalld::default_zone: "public"
firewalld::service_ensure: "running"

firewalld::zones:
  public:
    ensure: present
    target: default

firewalld::services:
  "Allow DHCPS, SSH, and Zabbix from the public zone":
    ensure: present
    service: ssh
    zone: public
  dhcp:
    ensure: present
    service: dhcp
    zone: public
  dhcpv6-client:
    ensure: present
    service: dhcpv6-client
    zone: public
  zabbix-agent:
    ensure: present
    service: zabbix-agent
    zone: public
  cockpit:
    ensure: present
    service: cockpit
    zone: public  
firewalld::ports:
  'Open port 5900 in the public zone':
    ensure: present
    zone: public
    port: 5900
    protocol: 'tcp'
