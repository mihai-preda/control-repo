# zabbix monitoring server
---

profile::zabbix::database_password: "ENC[PKCS7,]"

firewalld::default_zone: 'public'
firewalld::service_ensure: 'running'

firewalld::zones:
  public:
    ensure: present
    target: default
    
firewalld::services:
  'Allow DHCPS, SSH, and Zabbix from the public zone':
    ensure: present
    service: ssh
    zone: public
  dhcp:
    ensure: present
    service: dhcp
    zone: public
  dhcpv6-client:
    ensure: present
    service: dhcpv6-client
    zone: public
  zabbix-agent:
    ensure: present
    service: zabbix-agent
    zone: public
  http:
    ensure: present
    service: http
    zone: public
  https:
    ensure: present
    service: https
    zone: public  
  zabbix-server:
    ensure: present
    service: zabbix-server
    zone: public
  cockpit:
    ensure: absent
    service: cockpit
    zone: public  