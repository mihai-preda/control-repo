# data/nodes/app-srv1.preda.ca.yaml
---

profile::tomcat::test_app: true

# 8443 is reachable only from the httpd reverse proxy on web.preda.ca
# (profile::app_proxy); web sources from 10.21.2.11 on the 10.21.2.0/24 leg.
profile::tomcat::https_source: '10.21.2.11/32'

profile::hiera_test::ssl: true
profile::hiera_test::backups_enabled: true
profile::hiera_test::site_alias: app-srv1.preda.ca

firewalld::default_zone: 'public'
firewalld::service_ensure: 'running'

firewalld::zones:
  public:
    ensure: present
    target: default
    
firewalld::services:
  'Allow DHCPS, SSH, and Zabbix from the public zone':
    ensure: present
    service: ssh
    zone: public
  dhcp:
    ensure: present
    service: dhcp
    zone: public
  dhcpv6-client:
    ensure: present
    service: dhcpv6-client
    zone: public
  zabbix-agent:
    ensure: present
    service: zabbix-agent
    zone: public  
  cockpit:
    ensure: absent
    service: cockpit
    zone: public    