# data/nodes/app-srv1.preda.ca.yaml
---

profile::hiera_test::ssl: true
profile::hiera_test::backups_enabled: true
profile::hiera_test::site_alias: app-srv1.preda.ca

firewalld::zones:
  public:
    ensure: present
    targe: default
    
firewalld::services:
  'Allow DHCPS, SSH, and Zabbix from the public zone':
    ensure: present
    service: ssh
    zone: public
  dhcp:
    ensure: absent
    service: dhcp
    zone: public
  dhcpv6-client:
    ensure: present
    service: dhcpv6-client
    zone: public
  zabbix-agent:
    ensure: present
    service: zabbix-agent
    zone: public  